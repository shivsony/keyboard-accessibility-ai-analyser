<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Well-behaved</title>
  </head>
  <body>
    <!-- Three native controls in a sensible order. Tab order matches reading order. -->
    <main>
      <h1>Well-behaved page</h1>
      <button id="first">First</button>
      <a id="second" href="#target">Second</a>
      <input id="third" type="text" aria-label="Third field" />
      <p id="not-interactive">Plain text, not focusable.</p>
    </main>
  </body>
</html>
